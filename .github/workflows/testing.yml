name: Test GeoClaw

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '**.rst'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '**.rst'
      - 'docs/**'
      - '.gitignore'

  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. new pushes to a PR) so we do not
# stack full matrix runs and burn Actions minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAW: ${{ github.workspace }}

jobs:
  python-tests:
    name: >
      python - ${{ matrix.os }} - py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
            toolchain: {compiler: gcc, version: 14}
          - os: ubuntu-latest
            python-version: '3.13'
            toolchain: {compiler: gcc, version: 14}

    steps:
    # The tests themselves are pure Python (-m "python"), but installing the
    # clawpack meta-package below compiles Fortran extension modules
    # (pyclaw/classic), so a Fortran compiler is required.  Set one up explicitly
    # rather than relying on the runner image shipping gfortran.  netcdf-fortran
    # is not needed here (no GeoClaw build), so it is omitted.
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up compilers
      uses: fortran-lang/setup-fortran@v1.9.0
      id: setup-fortran
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}

    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install meson-python ninja pytest numpy pandas xarray scipy netCDF4

    - name: Checkout Clawpack
      uses: actions/checkout@v6.0.2
      with:
        repository: clawpack/clawpack
        ref: master
        submodules: true

    - name: Checkout GeoClaw branch
      uses: actions/checkout@v6.0.2
      with:
        path: geoclaw

    - name: Install clawpack python
      run: |
        pip install --no-build-isolation --editable .

    - name: Run Python Unit Tests
      run: |
        cd ${CLAW}/geoclaw
        pytest --basetemp=${CLAW}/geoclaw/pytest_tmp -vv -s -o addopts="" \
          -m "python and not remote"

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test_results_python_${{ matrix.os }}_py${{ matrix.python-version }}
        path: ${{ env.CLAW }}/geoclaw/pytest_tmp
        if-no-files-found: ignore

  regression-tests:
    name: >
      regression - ${{ matrix.os }} - ${{ matrix.toolchain.compiler }} ${{ matrix.build }} - py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Linux only on the per-PR path; macOS regression runs nightly
        # (slow-tests.yml) where its 10x minute multiplier is paid once a day.
        os: [ubuntu-latest]
        build: [debug, opt]
        python-version: ['3.12']
        toolchain:
          - {compiler: gcc, version: 14}

    steps:
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libblas-dev liblapack-dev libnetcdf-dev libnetcdff-dev pkg-config

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up compilers
      uses: fortran-lang/setup-fortran@v1.9.0
      id: setup-fortran
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}

    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install meson-python ninja pytest numpy pandas xarray scipy netCDF4

    - name: Checkout Clawpack
      uses: actions/checkout@v6.0.2
      with:
        repository: clawpack/clawpack
        ref: master
        submodules: true

    - name: Checkout GeoClaw branch
      uses: actions/checkout@v6.0.2
      with:
        path: geoclaw

    - name: Install clawpack python
      run: |
        pip install --no-build-isolation --editable .

    - name: Run Regression Tests
      run: |
        cd ${CLAW}/geoclaw
        source .github/scripts/set_test_env.sh regression "${{ matrix.toolchain.compiler }}" "${{ matrix.build }}"
        echo "FFLAGS: $FFLAGS"
        echo "OMP_NUM_THREADS: $OMP_NUM_THREADS"
        # 'not remote' keeps live network fetches off the per-PR path; the
        # remote-marked regressions (chile2010, ike, isaac, ...) run nightly.
        pytest --basetemp=${CLAW}/geoclaw/pytest_tmp -vv -s -o addopts="" \
          -m "regression and not slow and not adjoint and not remote"

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test_results_${{ matrix.os }}_${{ matrix.toolchain.compiler }}_${{ matrix.build }}
        path: ${{ env.CLAW }}/geoclaw/pytest_tmp
        if-no-files-found: ignore
