name: Nightly and slow tests

# Runs once a day (and on demand).  In addition to the `slow`-marked tests,
# this workflow carries the coverage that was moved off the per-PR path to save
# GitHub Actions minutes:
#   * macOS regression + Python tests (10x minute multiplier, paid once/day)
#   * `remote`-marked tests that make live network fetches
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

env:
  CLAW: ${{ github.workspace }}

jobs:
  slow-tests:
    name: >
      slow - ${{ matrix.os }} - ${{ matrix.toolchain.compiler }} ${{ matrix.build }} - py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build: [opt]
        python-version: ['3.12']
        toolchain:
          - {compiler: gcc, version: 14}

    steps:
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libblas-dev liblapack-dev libnetcdf-dev libnetcdff-dev pkg-config

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up compilers
      uses: fortran-lang/setup-fortran@v1.9.0
      id: setup-fortran
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}

    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install meson-python ninja pytest numpy pandas xarray scipy netCDF4

    - name: Checkout Clawpack
      uses: actions/checkout@v6.0.2
      with:
        repository: clawpack/clawpack
        ref: master
        submodules: true

    - name: Checkout GeoClaw branch
      uses: actions/checkout@v6.0.2
      with:
        path: geoclaw

    - name: Install clawpack python
      run: |
        pip install --no-build-isolation --editable .

    - name: Run Slow Tests
      run: |
        cd ${CLAW}/geoclaw
        source .github/scripts/set_test_env.sh slow "${{ matrix.toolchain.compiler }}" "${{ matrix.build }}"
        echo "FFLAGS: $FFLAGS"
        echo "OMP_NUM_THREADS: $OMP_NUM_THREADS"
        pytest --basetemp=${CLAW}/geoclaw/pytest_tmp -vv -s -o addopts="" \
          -m "slow"

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test_results_slow_${{ matrix.os }}_${{ matrix.toolchain.compiler }}_${{ matrix.build }}
        path: ${{ env.CLAW }}/geoclaw/pytest_tmp
        if-no-files-found: ignore

  regression-tests:
    name: >
      regression - ${{ matrix.os }} - ${{ matrix.toolchain.compiler }} ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # macOS: full regression suite (moved off the per-PR path).
        # ubuntu: only the remote-marked cases (the rest run per-PR in
        # testing.yml) so nightly still exercises the network-fetch paths.
        include:
          - os: macos-latest
            build: debug
            toolchain: {compiler: gcc, version: 15}
            markers: "regression and not slow and not adjoint"
          - os: macos-latest
            build: opt
            toolchain: {compiler: gcc, version: 15}
            markers: "regression and not slow and not adjoint"
          - os: ubuntu-latest
            build: opt
            toolchain: {compiler: gcc, version: 14}
            markers: "regression and remote and not slow and not adjoint"

    steps:
    - name: Install system dependencies
      run: |
        if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev libnetcdf-dev libnetcdff-dev pkg-config
        elif [ "${{ matrix.os }}" == "macos-latest" ]; then
          brew update
          brew install netcdf-fortran
        fi

    - name: Set up Python 3.12
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.12'

    - name: Set up compilers
      uses: fortran-lang/setup-fortran@v1.9.0
      id: setup-fortran
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}

    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install meson-python ninja pytest numpy pandas xarray scipy netCDF4

    - name: Checkout Clawpack
      uses: actions/checkout@v6.0.2
      with:
        repository: clawpack/clawpack
        ref: master
        submodules: true

    - name: Checkout GeoClaw branch
      uses: actions/checkout@v6.0.2
      with:
        path: geoclaw

    - name: Install clawpack python
      run: |
        pip install --no-build-isolation --editable .

    - name: Run Regression Tests
      run: |
        cd ${CLAW}/geoclaw
        source .github/scripts/set_test_env.sh regression "${{ matrix.toolchain.compiler }}" "${{ matrix.build }}"
        echo "FFLAGS: $FFLAGS"
        echo "OMP_NUM_THREADS: $OMP_NUM_THREADS"
        pytest --basetemp=${CLAW}/geoclaw/pytest_tmp -vv -s -o addopts="" \
          -m "${{ matrix.markers }}"

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test_results_nightly_${{ matrix.os }}_${{ matrix.toolchain.compiler }}_${{ matrix.build }}
        path: ${{ env.CLAW }}/geoclaw/pytest_tmp
        if-no-files-found: ignore

  python-tests:
    name: >
      python - ${{ matrix.os }} - py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS Python coverage (moved off the per-PR path) plus one Linux cell
        # that runs the remote-marked Python tests nightly.
        include:
          - os: macos-latest
            python-version: '3.12'
            markers: "python"
            toolchain: {compiler: gcc, version: 15}
          - os: macos-latest
            python-version: '3.13'
            markers: "python"
            toolchain: {compiler: gcc, version: 15}
          - os: ubuntu-latest
            python-version: '3.12'
            markers: "python and remote"
            toolchain: {compiler: gcc, version: 14}

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    # Installing the clawpack meta-package below compiles Fortran extension
    # modules (pyclaw/classic), so a Fortran compiler is required even though the
    # tests themselves are pure Python.  ubuntu-latest ships gfortran, but macOS
    # runners do not, so set one up explicitly.
    - name: Set up compilers
      uses: fortran-lang/setup-fortran@v1.9.0
      id: setup-fortran
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}

    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install meson-python ninja pytest numpy pandas xarray scipy netCDF4

    - name: Checkout Clawpack
      uses: actions/checkout@v6.0.2
      with:
        repository: clawpack/clawpack
        ref: master
        submodules: true

    - name: Checkout GeoClaw branch
      uses: actions/checkout@v6.0.2
      with:
        path: geoclaw

    - name: Install clawpack python
      run: |
        pip install --no-build-isolation --editable .

    - name: Run Python Unit Tests
      run: |
        cd ${CLAW}/geoclaw
        pytest --basetemp=${CLAW}/geoclaw/pytest_tmp -vv -s -o addopts="" \
          -m "${{ matrix.markers }}"

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test_results_nightly_python_${{ matrix.os }}_py${{ matrix.python-version }}
        path: ${{ env.CLAW }}/geoclaw/pytest_tmp
        if-no-files-found: ignore
